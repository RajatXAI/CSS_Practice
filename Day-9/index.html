<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <title>Pikachu</title>
  </head>
  <body>
    <main>
      <div class="card">
        <div class="card__left">
          <img class="card__logo" src="/Image/pngwing.com (1).png" alt="Pokemon" />

          <div class="card__content">
            <p class="card__subtitle">POKEMON GEN I</p>

            <h1 class="card__title">Pikachu</h1>

            <p class="card__description">
              Pikachu is an Electric-type Pokémon introduced in Generation I.
              Pikachu are small, chubby and incredibly cute mouse-like Pokémon.
              They are almost completely covered by yellow fur.
            </p>

            <h4 class="card__counter">----- 01 / 08</h4>
          </div>
        </div>

        <div class="card__right">
          <i class="ri-menu-line card__menu"></i>

          <div class="card__dots">
            <div class="card__dot active"></div>
            <div class="card__dot"></div>
            <div class="card__dot"></div>
            <div class="card__dot"></div>
            <div class="card__dot"></div>
          </div>
        </div>

        <img class="card__image" src="/Image//pngwing.com.png" alt="Pikachu" />
      </div>
    </main>
  </body>
</html>
