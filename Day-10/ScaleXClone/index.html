<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ScaleX Landing Page</title>
</head>
<body>

    <main>
        <nav>
            <div class="nav__logo">
                <h2>ScaleX</h2>
            </div>
            <div class="nav__tabs">
                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">Blogs</a>
                <a href="#">Contact Us</a>
            </div>
            <div class="nav__button">
                <button>Get Started</button>
            </div>
        </nav>
        <div class="hero">
            <h1>Insights & Blogs</h1>
            <div class="hero__filters">
                <button class="anchor-unique">All</button>
                <button class="hero-btn">Tech</button>
                <button class="hero-btn">SaaS</button>
                <button class="hero-btn">Marketing</button>
            </div>
        </div>
        <div class="cards">
            <div class="card">
                <img src="https://framerusercontent.com/images/4hcgqbL0aY5NaOxz6TPo1YeJmF0.png" alt="">
                <div class="card__content">
                    <h4>Tech</h4>
                    <h2>The Ultimate Guide To SaaS Marketing</h2>
                    <p>May 23, 2025</p>
                </div>
            </div>
            <div class="card">
                <img src="https://framerusercontent.com/images/P8JivQcYSew89yyXBj9Hvpg2Ng.png" alt="">
                <div class="card__content">
                    <h4>SaaS</h4>
                    <h2>5 Key Trends In SaaS Growth For 2025</h2>
                    <p>May 23, 2025</p>
                </div>
            </div>
            <div class="card">
                <img src="https://framerusercontent.com/images/swiwWfM27XbuBMg97nrmtORk.png?scale-down-to=1024" alt="">
                <div class="card__content">
                    <h4>Marketing</h4>
                    <h2>How Data-Driven Strategies Are Important</h2>
                    <p>May 23, 2025</p>
                </div>
            </div>
        </div>
    </main>
    
</body>
</html>
